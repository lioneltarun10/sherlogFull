# =================================
# SherLogs Backend - Quarkus Config
# =================================

# Application name
quarkus.application.name=sherlogs-backend

# HTTP server configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# =================================
# CORS Configuration
# =================================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600

# =================================
# Logging Configuration
# =================================
quarkus.log.level=INFO
quarkus.log.category."com.xorcists".level=DEBUG

# Console logging format (disable JSON for dev mode)
%dev.quarkus.log.console.json=false
%prod.quarkus.log.console.json=true

# =================================
# Health Check Configuration
# =================================
quarkus.smallrye-health.root-path=/q/health

# =================================
# Dev Mode Configuration
# =================================
%dev.quarkus.live-reload.instrumentation=true

# =================================
# Azure OpenAI Configuration
# =================================
azure.openai.endpoint=https://hackathon-2207.openai.azure.com/
# ADD KEY HERE
azure.openai.deployment-name=gpt-5.4
azure.openai.api-version=2024-12-01-preview
